<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; width: 280px; font: 13px "Segoe UI", system-ui, sans-serif;
         background: #0d1220; color: #e8edf7; }
  .wrap { padding: 16px; }
  h1 { margin: 0 0 12px; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 22px; height: 22px; }
  .card { background: #161d2f; border: 1px solid #243049; border-radius: 8px; padding: 12px; }
  .status { display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #8b96ad; flex: none; }
  .on .dot { background: #34d399; box-shadow: 0 0 8px #34d399; }
  .off .dot { background: #f87171; }
  label.toggle { display: flex; justify-content: space-between; align-items: center;
                 margin-top: 12px; cursor: pointer; }
  input[type=checkbox] { accent-color: #22d3ee; width: 16px; height: 16px; }
  .muted { color: #8b96ad; font-size: 11px; margin-top: 10px; line-height: 1.4; }
  .err { color: #f87171; font-size: 11px; margin-top: 10px; line-height: 1.4; word-break: break-word; }
</style>
</head>
<body>
<div class="wrap">
  <h1><img src="icon48.png" alt="">TurboDL</h1>
  <div class="card">
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Vérification…</span></div>
    <label class="toggle">Intercepter les téléchargements <input type="checkbox" id="enabled"></label>
  </div>
  <div class="err" id="err" hidden></div>
  <div class="muted">Clic droit sur un lien (ou un lien magnet) → « Télécharger avec TurboDL ».<br>
    Les fichiers de moins de 1 Mo restent dans le navigateur (sauf les .torrent).</div>
</div>
<script src="popup.js"></script>
</body>
</html>
